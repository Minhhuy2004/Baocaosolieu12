name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run predeploy
      - name: Preserve previously deployed bundles
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          while IFS= read -r asset_path; do
            [[ -n "$asset_path" ]] || continue
            mkdir -p "dist/$(dirname "$asset_path")"
            git show "FETCH_HEAD:$asset_path" > "dist/$asset_path"
          done < <(
            git ls-tree -r --name-only FETCH_HEAD -- assets |
              grep -E '^assets/[^/]+\.(js|css)$' || true
          )
      - name: Preserve bundles used by cached pages
        shell: bash
        run: |
          set -euo pipefail
          origin="https://minhhuy2004.github.io"
          site_path="/Baocaosolieu12"
          html="$(curl --fail --silent --show-error "$origin$site_path/")"
          while IFS= read -r asset_path; do
            [[ -n "$asset_path" ]] || continue
            file_path="${asset_path#"$site_path"/}"
            mkdir -p "dist/$(dirname "$file_path")"
            curl --fail --silent --show-error "$origin$asset_path" \
              --output "dist/$file_path"
          done < <(
            printf '%s' "$html" |
              grep -oE '/Baocaosolieu12/assets/[^"]+\.(js|css)' |
              sort -u
          )
      - name: Include custom domain configuration
        run: cp CNAME dist/CNAME
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
